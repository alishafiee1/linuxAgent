# Server block for the existing nginx in rodo-proxy-1 (same pattern as node.roditeam.ir).
# The panel listens on 127.0.0.1:8787 inside hermes; an Incus proxy device exposes it on the
# docker bridge gateway (see deploy/README.md step 6), so nginx reaches it at 172.18.0.1:8788.
server {
    listen 443 ssl;
    http2 on;
    server_name agent.roditeam.ir;

    ssl_certificate     /etc/nginx/certs/agent/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/agent/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://172.18.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Server-sent events (live run output)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name agent.roditeam.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
